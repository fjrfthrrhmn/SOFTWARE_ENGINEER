<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffff" />
    <title>StudentConnect | Semua Informasi Akademik</title>
    <link rel="icon" href="../public/brand/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"></script>
    <script src="https://unpkg.com/reicon/cdn/reicon.js"></script>
    <style type="text/tailwindcss">
      @theme {
        --font-sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
        --radius: 1rem;
        --radius-sm: calc(var(--radius) * 0.6);
        --radius-md: calc(var(--radius) * 0.8);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) * 1.4);
        --radius-2xl: calc(var(--radius) * 1.8);
        --radius-3xl: calc(var(--radius) * 2.2);
        --radius-4xl: calc(var(--radius) * 2.6);
        --color-background: oklch(1 0 0);
        --color-foreground: oklch(0.141 0.005 285.823);
        --color-card: oklch(1 0 0);
        --color-card-foreground: oklch(0.141 0.005 285.823);
        --color-primary: #1c9cf0;
        --color-primary-foreground: oklch(0.97 0.014 254.604);
        --color-secondary: oklch(0.967 0.001 286.375);
        --color-secondary-foreground: oklch(0.21 0.006 285.885);
        --color-muted: oklch(0.967 0.001 286.375);
        --color-muted-foreground: oklch(0.552 0.016 285.938);
        --color-accent: oklch(0.967 0.001 286.375);
        --color-accent-foreground: oklch(0.21 0.006 285.885);
        --color-destructive: oklch(0.577 0.245 27.325);
        --color-border: oklch(0.92 0.004 286.32);
        --color-ring: oklch(0.705 0.015 286.067);
      }
    </style>
    <style>
      @view-transition {
        navigation: auto;
      }
      html {
        -webkit-tap-highlight-color: transparent;
      }
      .paper-grid {
        background-image:
          linear-gradient(
            to right,
            color-mix(in oklab, var(--color-foreground) 6%, transparent) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            color-mix(in oklab, var(--color-foreground) 6%, transparent) 1px,
            transparent 1px
          );
        background-size: 26px 26px;
        -webkit-mask-image: linear-gradient(
          to bottom,
          #000 0%,
          transparent 80%
        );
        mask-image: linear-gradient(to bottom, #000 0%, transparent 80%);
      }
      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes bob {
        0%,
        100% {
          transform: translateY(0) rotate(-1deg);
        }
        50% {
          transform: translateY(-10px) rotate(1deg);
        }
      }
      @media (prefers-reduced-motion: no-preference) {
        .enter {
          animation: rise 0.55s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }
        .bob {
          animation: bob 6s ease-in-out infinite;
        }
      }
    </style>
  </head>
  <body class="min-h-screen bg-background text-foreground antialiased">
    <div
      class="relative mx-auto min-h-screen w-full max-w-[640px] overflow-hidden bg-card sm:border-x sm:border-border"
    >
      <div aria-hidden="true" class="pointer-events-none absolute inset-0">
        <div class="paper-grid absolute inset-0 opacity-70"></div>
        <div
          class="absolute -top-32 left-1/2 size-64 -translate-x-1/2 rounded-full bg-primary/10 blur-3xl"
        ></div>
      </div>

      <main
        class="relative mt-10 flex flex-col justify-between min-h-screen gap-10 px-5 pt-4 pb-[calc(1.25rem_+_env(safe-area-inset-bottom))]"
      >
        <div class="flex flex-col gap-10">
          <figure
            class="enter relative min-h-50 max-h-90 flex items-center justify-center"
          >
          <div
              aria-hidden="true"
              class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 size-80 rounded-full bg-gradient-to-b from-primary/25 to-transparent"
            ></div>
            <div class="h-full flex justify-center items-end">
              <img
                src="../src/modules/onboarding/assets/onboarding-3.png"
                alt="Maskot MOCHI menyambut pengguna untuk mulai menggunakan StudentConnect"
                class="bob object-cover scale-90"
              />
            </div>

            <div
              class="absolute bottom-10 right-3 flex items-center gap-1.5 rounded-2xl bg-card/95 px-3 py-1.5 shadow-md ring-1 ring-border backdrop-blur-sm"
            >
              <re-icon
                icon="info-circle"
                size="14"
                class="text-primary stroke-2"
              ></re-icon>
              <span class="text-xs font-bold">Informasi akademik</span>
            </div>
          </figure>
          <div
            class="enter shrink-0 text-center"
            style="animation-delay: 0.08s"
          >
            <h1
              class="text-2xl leading-tight font-extrabold tracking-tight text-balance sm:text-3xl"
            >
              Informasi Kuliah dalam Satu Tempat
            </h1>
            <p
              class="mt-2 max-w-prose text-sm leading-6 text-muted-foreground text-pretty"
            >
              Akses informasi perkuliahan sesuai kebutuhanmu. Mulai dari melihat
              jadwal kelas hingga membuka materi pembelajaran, semuanya tersedia
              melalui StudentConnect
            </p>
            <div
              class="enter mt-auto flex shrink-0 flex-col w-max mx-auto"
              style="animation-delay: 0.16s"
            >
              <nav
                aria-label="Langkah onboarding"
                class="flex items-center justify-center gap-0"
              >
                <a
                  href="./ui-onboarding-1.html"
                  aria-label="Langkah 1"
                  class="flex h-9 w-8 items-center justify-center rounded-full focus-visible:ring-4 focus-visible:ring-ring/40 focus-visible:outline-none"
                >
                  <span class="size-1.5 rounded-full bg-border"></span>
                </a>
                <a
                  href="./ui-onboarding-2.html"
                  aria-label="Langkah 2"
                  class="flex h-9 w-8 items-center justify-center rounded-full focus-visible:ring-4 focus-visible:ring-ring/40 focus-visible:outline-none"
                >
                  <span class="size-1.5 rounded-full bg-border"></span>
                </a>
                <a
                  href="./ui-onboarding-3.html"
                  aria-current="step"
                  aria-label="Langkah 3"
                  class="flex h-9 w-8 items-center justify-center rounded-full focus-visible:ring-4 focus-visible:ring-ring/40 focus-visible:outline-none"
                >
                  <span class="h-1.5 w-6 rounded-full bg-primary"></span>
                </a>
              </nav>
            </div>
          </div>
        </div>
        <div class="mt-auto w-full">
          <a
            href="/login"
            class="inline-flex h-12 w-full items-center justify-center gap-2 rounded-2xl bg-primary px-6 text-sm font-bold text-primary-foreground shadow-sm transition hover:bg-primary/90 active:translate-y-px focus-visible:ring-4 focus-visible:ring-ring/40 focus-visible:outline-none"
          >
            Mulai Sekarang
            <re-icon icon="chevron-right" size="18" class="stroke-2"></re-icon>
          </a>
          <a
            href="./ui-onboarding-2.html"
            class="mt-2 inline-flex h-11 w-full items-center justify-center gap-2 rounded-2xl text-sm font-semibold text-muted-foreground transition hover:bg-muted hover:text-foreground focus-visible:ring-4 focus-visible:ring-ring/40 focus-visible:outline-none"
          >
            <re-icon icon="chevron-left" size="18" class="stroke-2"></re-icon>
            Kembali
          </a>
        </div>
      </main>
    </div>
  </body>
</html>
