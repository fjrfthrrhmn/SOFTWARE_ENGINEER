<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#ffff" />
    <title>StudentConnect | Informasi Akademik</title>
    <link rel="icon" href="../public/brand/icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4.3.3/dist/index.global.js"></script>
    <script src="https://unpkg.com/reicon/cdn/reicon.js"></script>
    <noscript
      ><meta http-equiv="refresh" content="3;url=./ui-onboarding-1.html"
    /></noscript>
    <style type="text/tailwindcss">
      @theme {
        --font-sans: "Plus Jakarta Sans", ui-sans-serif, system-ui, sans-serif;
        --radius: 1rem;
        --radius-sm: calc(var(--radius) * 0.6);
        --radius-md: calc(var(--radius) * 0.8);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) * 1.4);
        --radius-2xl: calc(var(--radius) * 1.8);
        --radius-3xl: calc(var(--radius) * 2.2);
        --radius-4xl: calc(var(--radius) * 2.6);
        --color-background: oklch(1 0 0);
        --color-foreground: oklch(0.141 0.005 285.823);
        --color-card: oklch(1 0 0);
        --color-card-foreground: oklch(0.141 0.005 285.823);
        --color-primary: #1c9cf0;
        --color-primary-foreground: oklch(0.97 0.014 254.604);
        --color-secondary: oklch(0.967 0.001 286.375);
        --color-secondary-foreground: oklch(0.21 0.006 285.885);
        --color-muted: oklch(0.967 0.001 286.375);
        --color-muted-foreground: oklch(0.552 0.016 285.938);
        --color-accent: oklch(0.967 0.001 286.375);
        --color-accent-foreground: oklch(0.21 0.006 285.885);
        --color-destructive: oklch(0.577 0.245 27.325);
        --color-border: oklch(0.92 0.004 286.32);
        --color-ring: oklch(0.705 0.015 286.067);
      }
    </style>
    <style>
      @view-transition {
        navigation: auto;
      }
      html {
        -webkit-tap-highlight-color: transparent;
      }
      .paper-grid {
        background-image:
          linear-gradient(
            to right,
            color-mix(in oklab, var(--color-foreground) 6%, transparent) 1px,
            transparent 1px
          ),
          linear-gradient(
            to bottom,
            color-mix(in oklab, var(--color-foreground) 6%, transparent) 1px,
            transparent 1px
          );
        background-size: 26px 26px;
        -webkit-mask-image: linear-gradient(
          to bottom,
          #000 0%,
          transparent 80%
        );
        mask-image: linear-gradient(to bottom, #000 0%, transparent 80%);
      }
      .loadbar {
        transform-origin: left;
      }

      @keyframes load {
        from {
          stroke-dashoffset: 100;
        }
        to {
          stroke-dashoffset: 0;
        }
      }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(16px) scale(0.985);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @keyframes sway {
        0%,
        100% {
          transform: translateY(0) rotate(-2deg);
        }
        50% {
          transform: translateY(-10px) rotate(2deg);
        }
      }

      @media (prefers-reduced-motion: no-preference) {
        .enter {
          animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
        }
        .sway {
          animation: sway 6s ease-in-out infinite;
        }
        .loadbar {
          animation: load 4s cubic-bezier(0, 0, 0.2, 1) forwards;
        }
      }
    </style>
  </head>
  <body
    class="h-screen overflow-y-hidden bg-background text-foreground antialiased"
  >
    <div
      class="relative mx-auto flex h-full w-full max-w-[640px] flex-col overflow-hidden bg-card sm:border-x sm:border-border"
    >
      <div aria-hidden="true" class="pointer-events-none absolute inset-0">
        <div class="paper-grid absolute inset-0 opacity-70"></div>
        <div
          class="absolute -top-32 left-1/2 size-64 -translate-x-1/2 rounded-full bg-primary/10 blur-3xl"
        ></div>
      </div>

      <main
        class="relative flex min-h-0 flex-1 flex-col items-center justify-center gap-6 px-6 text-center"
      >
        <div class="enter">
          <div
            class="sway size-28 overflow-hidden rounded-2xl bg-card shadow-lg ring-1 ring-border"
          >
            <img
              src="../public/brand/icon.png"
              alt="Logo StudentConnect"
              class="size-full scale-110 object-cover"
            />
          </div>
        </div>

        <div class="enter" style="animation-delay: 0.12s">
          <p class="text-xl font-bold text-primary">Your Academic Companion</p>
          <p
            class="mt-4 max-w-xs text-base leading-6 text-muted-foreground text-pretty"
          >
            Akses informasi akademik dalam satu platform untuk mendukung
            aktivitas akademik mahasiswa
          </p>
        </div>
      </main>

      <footer
        class="relative shrink-0 px-6 pb-[calc(1.25rem_+_env(safe-area-inset-bottom))]"
      >
        <div class="relative h-4 w-full overflow-hidden">
          <svg
            viewBox="0 0 320 16"
            preserveAspectRatio="none"
            class="absolute inset-0 h-full w-full"
            fill="none"
          >
            <!-- Background wave -->
            <path
              d="M0 8 Q5 2 10 8 T20 8 T30 8 T40 8 T50 8 T60 8 T70 8 T80 8 T90 8 T100 8 T110 8 T120 8 T130 8 T140 8 T150 8 T160 8 T170 8 T180 8 T190 8 T200 8 T210 8 T220 8 T230 8 T240 8 T250 8 T260 8 T270 8 T280 8 T290 8 T300 8 T310 8 T320 8"
              stroke="currentColor"
              stroke-width="3"
              stroke-linecap="round"
              class="text-muted"
            />

            <!-- Animated wave -->
            <path
              d="M0 8 Q5 2 10 8 T20 8 T30 8 T40 8 T50 8 T60 8 T70 8 T80 8 T90 8 T100 8 T110 8 T120 8 T130 8 T140 8 T150 8 T160 8 T170 8 T180 8 T190 8 T200 8 T210 8 T220 8 T230 8 T240 8 T250 8 T260 8 T270 8 T280 8 T290 8 T300 8 T310 8 T320 8"
              pathLength="100"
              stroke="#1c9cf0"
              stroke-width="3"
              stroke-linecap="round"
              class="loadbar"
              stroke-dasharray="100"
              stroke-dashoffset="100"
            />
          </svg>
        </div>
        <p
          id="loadingLabel"
          class="mt-3 text-center text-sm font-medium text-muted-foreground"
        >
          Memuat informasi akademik...
        </p>
      </footer>
    </div>

    <script>
      const reduceMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)",
      ).matches;
      const labels = [
        "Memuat informasi akademik...",
        "Menyiapkan jadwal perkuliahan...",
        "Menghubungkan data mahasiswa...",
        "Menyiapkan materi pembelajaran...",
      ];
      const label = document.getElementById("loadingLabel");
      if (!reduceMotion) {
        let i = 0;
        window.setInterval(() => {
          i = (i + 1) % labels.length;
          label.textContent = labels[i];
        }, 900);
      }
      window.setTimeout(
        () => window.location.replace("./ui-onboarding-1.html"),
        reduceMotion ? 700 : 2700,
      );
    </script>
  </body>
</html>
